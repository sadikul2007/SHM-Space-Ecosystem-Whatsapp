<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHMspace WhatsApp Marketing Panel</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #070b14;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .panel {
      width: 100%;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    h2 { margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; color: #cbd5e1; }
    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #0b1220;
      color: #fff;
      padding: 12px;
      font-size: 14px;
    }
    button {
      margin-top: 18px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    #status {
      margin-top: 14px;
      font-size: 13px;
      white-space: pre-wrap;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>WhatsApp Sender Panel</h2>
    <label for="phone">প্রাপকের নম্বর (দেশের কোডসহ, '+' ছাড়া)</label>
    <input id="phone" type="text" placeholder="919064373386" required />

    <label for="msg">মেসেজ বা Template নাম</label>
    <textarea id="msg" rows="4" placeholder="Hello! SHMspace থেকে মেসেজ পাঠানো হচ্ছে..." required></textarea>

    <label>
      <input id="isTemplate" type="checkbox" style="width:auto; margin-right:8px;" />
      Template হিসেবে পাঠান (যেমন: hello_world)
    </label>

    <button id="sendBtn" type="button">Send WhatsApp Message</button>
    <div id="status"></div>
  </div>

  <script>
    const WORKER_URL = "shmspace.sadikul2007.workers.dev";

    document.getElementById("sendBtn").addEventListener("click", async () => {
      const to = document.getElementById("phone").value.trim();
      const textVal = document.getElementById("msg").value.trim();
      const isTemplate = document.getElementById("isTemplate").checked;
      const statusEl = document.getElementById("status");

      if (!to || !textVal) {
        statusEl.textContent = "নম্বর এবং মেসেজ/টেমপ্লেট দুটোই দিন।";
        return;
      }

      statusEl.textContent = "পাঠানো হচ্ছে...";
      const payload = isTemplate ? { to, templateName: textVal } : { to, message: textVal };

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        statusEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
