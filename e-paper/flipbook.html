<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063d32"><title>Banganur Flipbook</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef2;color:#14283d;font-family:'Noto Sans Bengali',sans-serif}.top{background:#071a2a;color:white;padding:12px max(16px,calc((100% - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;color:#fff;text-decoration:none}.brand span{color:#ff982d}.back{background:#08765e;color:#fff;text-decoration:none;padding:8px 13px;border-radius:7px;font-size:12px;font-weight:800}.head{text-align:center;padding:19px 10px 7px}.head h1{font-size:22px;color:#005743;margin:0 0 3px}.head p{font-size:12px;color:#718096;margin:0}.bar{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;padding:13px}.btn{border:0;border-radius:7px;padding:9px 14px;background:#005743;color:#fff;font-weight:800;cursor:pointer;font-family:inherit}.btn.alt{background:white;border:1px solid #cbd5e1;color:#263b4f;text-decoration:none}.count{font:700 12px Roboto;color:#405267;min-width:85px;text-align:center}#viewer{max-width:1160px;min-height:440px;margin:0 auto;padding:0 15px;display:flex;justify-content:center;align-items:center;overflow:hidden}#book{margin:auto}.page{background:white;overflow:hidden;box-shadow:0 3px 12px #0002}.page canvas{display:block;width:100%;height:100%;object-fit:contain}.status{text-align:center;color:#667789;padding:25px}.error{background:#fff;border:1px solid #fecaca;color:#991b1b;padding:16px;border-radius:10px;max-width:650px;line-height:1.8}.foot{text-align:center;color:#718096;font-size:11px;padding:24px}@media(max-width:600px){#viewer{min-height:300px}.head h1{font-size:19px}.btn{font-size:12px;padding:8px 11px}}
</style></head><body>
<header class="top"><a class="brand" href="index.html">বঙ্গনুর <span>BANGANUR</span></a><a class="back" href="index.html">← E-Paper Archive</a></header>
<div class="head"><h1 id="title">E-Paper Flipbook</h1><p>পাতা উল্টে সংবাদপত্র পড়ুন</p></div>
<div class="bar"><button class="btn" id="prev">❮ Previous</button><span class="count" id="counter">Loading...</span><button class="btn" id="next">Next ❯</button><a class="btn alt" id="pdf" href="#" target="_blank">View PDF</a><button class="btn alt" id="full">⛶ Fullscreen</button></div>
<div id="viewer"><div class="status" id="status">PDF লোড হচ্ছে...</div><div id="book"></div></div><div class="foot">BANGANUR · DIGITAL NEWSPAPER</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(async()=>{const q=new URLSearchParams(location.search),file=q.get("file")||"demo1.pdf",title=q.get("title")||"E-Paper Flipbook";document.getElementById("title").textContent=title;document.getElementById("pdf").href=file;
const status=document.getElementById("status"),book=document.getElementById("book"),viewer=document.getElementById("viewer");
try{if(!window.pdfjsLib||!window.St)throw Error("Flipbook library load হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const pdf=await pdfjsLib.getDocument(file).promise,pages=[];
for(let n=1;n<=pdf.numPages;n++){status.textContent=`পৃষ্ঠা তৈরি হচ্ছে ${n}/${pdf.numPages}`;const page=await pdf.getPage(n),v=page.getViewport({scale:1.2}),canvas=document.createElement("canvas");canvas.width=Math.ceil(v.width);canvas.height=Math.ceil(v.height);await page.render({canvasContext:canvas.getContext("2d"),viewport:v}).promise;const d=document.createElement("div");d.className="page";d.appendChild(canvas);pages.push(d)}
status.remove();const flip=new St.PageFlip(book,{width:550,height:760,size:"stretch",minWidth:280,maxWidth:550,minHeight:380,maxHeight:760,maxShadowOpacity:.35,showCover:false,mobileScrollSupport:true,usePortrait:true,autoSize:true});flip.loadFromHTML(pages);
const c=document.getElementById("counter"),update=()=>{c.textContent=(flip.getCurrentPageIndex()+1)+" / "+pdf.numPages;document.getElementById("prev").disabled=flip.getCurrentPageIndex()===0;document.getElementById("next").disabled=flip.getCurrentPageIndex()>=pdf.numPages-1};flip.on("flip",update);update();document.getElementById("prev").onclick=()=>flip.flipPrev();document.getElementById("next").onclick=()=>flip.flipNext();document.getElementById("full").onclick=()=>document.fullscreenElement?document.exitFullscreen():viewer.requestFullscreen?.();
}catch(e){status.innerHTML=`<div class="error"><b>PDF খোলা যাচ্ছে না।</b><br>PDF ফাইলটি একই ফোল্ডারে আছে এবং filename সঠিক কি না পরীক্ষা করুন।<br><small>${e.message}</small><br><a href="${file}" target="_blank">PDF সরাসরি খুলুন</a></div>`}
})();
</script></body></html>
